# Render Blueprint: one free web service that serves both the React site and the API.
# Database (Neon), photos (Cloudinary) and email (Brevo) are external, so nothing here is lost on redeploy.
services:
  - type: web
    name: braids-and-beyond
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: Vite (a dev dependency) is needed to build the site even with NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    # db:init is idempotent: creates/updates tables, never deletes data
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SALON_NAME
        value: Braids and Beyond
      - key: SALON_PHONE
        value: 0816 259 8682
      - key: SALON_ADDRESS
        value: 112 Herbert Macaulay Way, Ebute Metta East, Lagos
      - key: SALON_EMAIL
        value: braidsandbeyond@beautybayafrica.com
      - key: SALON_CURRENCY
        value: NGN
      - key: SALON_TIMEZONE
        value: Africa/Lagos
      - key: SLOT_INTERVAL_MINUTES
        value: "15"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_SSL
        value: "true"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Secrets: Render asks for these when you create the Blueprint (copy them from backend/.env.production)
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # Deposits: Paystack and/or bank transfer (leave all blank to take bookings without payment)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: BANK_NAME
        value: Providus Bank
      - key: BANK_ACCOUNT_NAME
        value: BEAUTY HUB AND COSMETICS ESSENTIALS NIGERIA
      - key: BANK_ACCOUNT_NUMBER
        value: "1307435193"
      - key: BANK2_NAME
        value: Moniepoint MFB
      - key: BANK2_ACCOUNT_NAME
        value: BEAUTY HUB AND COSMETICS ESSENTIALS NIGERIA
      - key: BANK2_ACCOUNT_NUMBER
        value: "5249789577"
      - key: DEPOSIT_PERCENT
        value: "50"
      - key: FREE_CANCELLATION_HOURS
        value: "24"
      - key: LATE_CANCEL_REFUND_PERCENT
        value: "50"
      # Optional: automatic WhatsApp confirmations (leave blank to skip)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "234"
      - key: WHATSAPP_TEMPLATE_NAME
        value: braidsandbeyonds_bookingconfirmed
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
