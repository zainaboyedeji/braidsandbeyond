# Render Blueprint: one free web service that serves both the React site and the API.
# Database (Neon), photos (Cloudinary) and email (Brevo) are external, so nothing here is lost on redeploy.
services:
  - type: web
    name: braids-and-beyond
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: Vite (a dev dependency) is needed to build the site even with NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    # db:init is idempotent: creates/updates tables, never deletes data
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SALON_NAME
        value: Braids and Beyond
      - key: SALON_CURRENCY
        value: NGN
      - key: SALON_TIMEZONE
        value: Africa/Lagos
      - key: SLOT_INTERVAL_MINUTES
        value: "15"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_SSL
        value: "true"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Secrets: Render asks for these when you create the Blueprint (copy them from backend/.env.production)
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
